name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Saraff.ThreadingModel.sln

      - name: Build
        run: dotnet build Saraff.ThreadingModel.sln -c Release --no-restore

      - name: Verify strong name
        shell: pwsh
        run: |
          $assemblyPath = Resolve-Path 'src/Saraff.ThreadingModel/bin/Release/net8.0-windows/Saraff.ThreadingModel.dll'
          $token = [System.Reflection.AssemblyName]::GetAssemblyName($assemblyPath).GetPublicKeyToken()
          if (-not $token) {
            throw 'The net8.0-windows assembly is not public-signed.'
          }
          $hex = ($token | ForEach-Object { $_.ToString('x2') }) -join ''
          if ($hex -ne '54f373c993f693dc') {
            throw "Unexpected public key token: $hex"
          }
          Write-Host "Saraff.ThreadingModel (net8.0-windows) public key token: $hex"

      - name: Test
        run: dotnet test tests/Saraff.ThreadingModel.Tests/Saraff.ThreadingModel.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack src/Saraff.ThreadingModel/Saraff.ThreadingModel.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
